name: "CI/CD Pipeline (HIPAA Compliant)"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-lint:
    name: security-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: false
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps --prefer-offline

      - name: TypeScript Lint (tsc --noEmit)
        run: npm run lint

      - name: Sentinel Security & Log Injection Audit
        run: npm run sentinel:audit

      - name: MSA & AI Services Governance Audit
        run: npm run msa:audit

      - name: Generate CycloneDX SBOM (EU CRA Compliance)
        run: npm run sbom

      - name: Run Tests (Vitest)
        run: npx vitest run

  python-ml-test:
    name: Python ML & Sidecar
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: false
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pocketgull_api/requirements.txt'

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libhdf5-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pocketgull_api/requirements.txt

      - name: Run Python Tests
        env:
          PYTHONPATH: pocketgull_api:.
        run: |
          python3 pocketgull_api/train_clinical_risk_models.py || true
          python3 pocketgull_api/run_tests.py

  test-e2e:
    name: test-e2e
    needs: [security-and-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: false
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps --prefer-offline

      - name: Cache Playwright Browsers
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Application
        run: npm run build
        env:
          CI: true
          NODE_ENV: 'production'
          GEMINI_API_KEY: 'placeholder-key-for-build'
          VITE_PUBLIC_API_URL: 'http://127.0.0.1:4000'
          SKIP_HEALTHCARE_PROVISION: 'true'
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Start Preview Server
        run: |
          npm run preview > /tmp/server.log 2>&1 &
          echo $! > .server.pid
        env:
          PORT: '4000'
          CI: true
          NODE_ENV: 'production'
          PLAYWRIGHT_TESTING: 'true'
          GEMINI_API_KEY: 'placeholder-key-for-build'
          SKIP_HEALTHCARE_PROVISION: 'true'

      - name: Wait for Preview Server
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:4000/health > /dev/null 2>&1; then
              echo "Preview server is ready on http://127.0.0.1:4000 (attempt $i)"
              exit 0
            fi
            echo "Waiting for preview server (attempt $i/30)..."
            sleep 2
          done
          echo "Preview server failed to start within 60s. Server logs:"
          cat /tmp/server.log || true
          exit 1

      - name: "Run E2E Tests (PR Fast Tier: Desktop Chrome)"
        if: github.event_name == 'pull_request'
        run: npm run test:e2e -- --project=desktop-chrome
        env:
          CI: true
          PORT: '4000'
          BASE_URL: 'http://127.0.0.1:4000'
          PLAYWRIGHT_WORKERS: '4'
          PLAYWRIGHT_TESTING: 'true'
          GEMINI_API_KEY: 'placeholder-key-for-build'
          SKIP_HEALTHCARE_PROVISION: 'true'

      - name: "Run E2E Tests (Main & Release Tier: Full Multi-Device Matrix)"
        if: github.event_name != 'pull_request'
        run: npm run test:e2e
        env:
          CI: true
          PORT: '4000'
          BASE_URL: 'http://127.0.0.1:4000'
          PLAYWRIGHT_WORKERS: '4'
          PLAYWRIGHT_TESTING: 'true'
          GEMINI_API_KEY: 'placeholder-key-for-build'
          SKIP_HEALTHCARE_PROVISION: 'true'

      - name: Stop Preview Server
        if: always()
        run: |
          if [ -f .server.pid ]; then
            kill $(cat .server.pid) || true
          fi

      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
