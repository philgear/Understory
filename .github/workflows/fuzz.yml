name: "Fuzz Testing"

on:
  push:
    branches: [ "main" ]
  schedule:
    # Run nightly at 4:00 AM UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Python Fuzz Tests (Atheris)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: false
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libhdf5-dev
          python -m pip install --upgrade pip
          pip install -r pocketgull_api/requirements.txt
          pip install atheris

      - name: Run Fuzz Targets
        run: |
          cd pocketgull_api
          python fuzz_targets.py
        env:
          # Atheris CI mode: run each target for a fixed number of iterations
          FUZZING_CI: "true"
        timeout-minutes: 10
