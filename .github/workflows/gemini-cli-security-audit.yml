name: Gemini CLI & Enterprise Security Governance Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  security-governance:
    name: Sentinel & Policy-as-Code Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Sentinel Security & Egress Guard
        run: node scripts/sentinel_security_guard.mjs

      - name: Generate & Verify CycloneDX 1.6 SBOM
        run: npm run sbom

      - name: Validate Cloud Run Enclave & gVisor Policy-as-Code
        run: |
          echo "Verifying Cloud Run gVisor and scale-to-zero configurations..."
          test -f gcp/cloudrun-service-enclave.json || (echo "Missing Cloud Run Enclave Spec" && exit 1)
          grep -q 'gvisor' gcp/cloudrun-service-enclave.json || (echo "gVisor sandbox annotation missing" && exit 1)
          grep -q 'minScale.*0' gcp/cloudrun-service-enclave.json || (echo "Scale-to-zero policy missing" && exit 1)
          echo "Policy-as-Code checks passed successfully."

      - name: Run Shift-Left Secret & Key Leak Detection
        run: node scripts/pre-commit-check.cjs
