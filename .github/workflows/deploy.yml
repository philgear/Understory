# Deployment Pipeline (Cloud Run) - Automated Production & Staging Deployment
name: Deployment Pipeline (Cloud Run)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: false
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps --prefer-offline
        
      - name: Security Audit
        run: npm audit --json > audit.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-audit-report
          path: audit.json
        
      # Ensure code quality for clinical safety
      - name: Run Linters
        run: npm run lint --if-present

      - name: Sentinel Network & Egress Security Guard
        run: npm run sentinel:audit

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pocketgull_api/requirements.txt'

      - name: Install Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libhdf5-dev
          python -m pip install --upgrade pip
          pip install -r pocketgull_api/requirements.txt

      - name: Run Python Dependency Audit
        run: |
          pip install pip-audit
          pip-audit -r pocketgull_api/requirements.txt --local || true 

      # Run unit tests (safety red-team + service logic)
      - name: Run Unit Tests
        run: npx vitest run

  test-e2e:
    needs: security-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: false
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Cache Playwright Browsers
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Rebuild Native Binaries
        run: npm rebuild esbuild --update-binary || true

      - name: Build Application
        run: npm run build
        env:
          CI: true
          NODE_ENV: 'production'
          GEMINI_API_KEY: 'placeholder-key-for-build'
          VITE_PUBLIC_API_URL: 'http://127.0.0.1:4000'
          SKIP_HEALTHCARE_PROVISION: 'true'
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Start Preview Server
        run: |
          npm run preview > /tmp/server.log 2>&1 &
          echo $! > .server.pid
        env:
          PORT: '4000'
          CI: true
          NODE_ENV: 'production'
          PLAYWRIGHT_TESTING: 'true'
          GEMINI_API_KEY: 'placeholder-key-for-build'
          SKIP_HEALTHCARE_PROVISION: 'true'

      - name: Wait for Preview Server
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:4000/health > /dev/null 2>&1; then
              echo "Preview server is ready on http://127.0.0.1:4000 (attempt $i)"
              exit 0
            fi
            echo "Waiting for preview server (attempt $i/30)..."
            sleep 2
          done
          echo "Preview server failed to start within 60s. Server logs:"
          cat /tmp/server.log || true
          exit 1

      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          CI: true
          PORT: '4000'
          BASE_URL: 'http://127.0.0.1:4000'
          PLAYWRIGHT_WORKERS: '4'
          PLAYWRIGHT_TESTING: 'true'
          GEMINI_API_KEY: 'placeholder-key-for-build'
          SKIP_HEALTHCARE_PROVISION: 'true'

      - name: Stop Preview Server
        if: always()
        run: |
          if [ -f .server.pid ]; then
            kill $(cat .server.pid) || true
          fi

      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # Deploy a tagged Cloud Run revision for PR preview/staging
  preview-deploy:
    needs: [security-and-lint, test-e2e]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: 'write'

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: false
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build Preview Image
        run: |
          gcloud auth configure-docker gcr.io
          IMAGE_PATH=gcr.io/${{ secrets.GCP_PROJECT_ID }}/pocket-gull
          docker build -t $IMAGE_PATH:pr-${{ github.event.number }} .

      - name: Push Preview Image
        run: |
          IMAGE_PATH=gcr.io/${{ secrets.GCP_PROJECT_ID }}/pocket-gull
          docker push $IMAGE_PATH:pr-${{ github.event.number }}

      - name: Deploy Preview to Cloud Run
        id: deploy-preview
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v2.3.0
        with:
          service: 'pocket-gull'
          region: 'us-central1'
          image: 'gcr.io/${{ secrets.GCP_PROJECT_ID }}/pocket-gull:pr-${{ github.event.number }}'
          tag: 'pr-${{ github.event.number }}'
          no_traffic: true  # Don't shift production traffic
          env_vars: |
            NODE_ENV=production
            OTEL_SDK_DISABLED=true
            GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}
            GOOGLE_CLOUD_REGION=us-central1
          flags: '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest --concurrency=100 --max-instances=1 --min-instances=0'

      - name: Comment Preview URL on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = '${{ steps.deploy-preview.outputs.url }}';
            const body = `🔍 **Preview deployed!**\n\n🌐 ${url}\n\n_This preview will be cleaned up when the PR is closed._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes('Preview deployed!'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  build-and-deploy:
    needs: [security-and-lint, test-e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production # Enables manual approval gates in GitHub
    
    # Required permissions for Workload Identity Federation
    permissions:
      contents: 'read'
      id-token: 'write'
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: false
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          # Keyless Workload Identity Federation
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
          
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
          
      - name: Build Docker Image
        run: |
          gcloud auth configure-docker gcr.io
          IMAGE_PATH=gcr.io/${{ secrets.GCP_PROJECT_ID }}/pocket-gull
          
          # Docker caching for faster builds
          docker pull $IMAGE_PATH:latest || true
          docker build \
            --cache-from $IMAGE_PATH:latest \
            -t $IMAGE_PATH:${{ github.sha }} \
            -t $IMAGE_PATH:latest .

      - name: Push Docker Image
        run: |
          IMAGE_PATH=gcr.io/${{ secrets.GCP_PROJECT_ID }}/pocket-gull
          docker push $IMAGE_PATH:${{ github.sha }}
          docker push $IMAGE_PATH:latest
          
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v2.3.0
        with:
          service: 'pocket-gull'
          region: 'us-central1'
          image: 'gcr.io/${{ secrets.GCP_PROJECT_ID }}/pocket-gull:${{ github.sha }}'
          env_vars: |
            NODE_ENV=production
            OTEL_SDK_DISABLED=true
            GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}
            GOOGLE_CLOUD_REGION=us-central1
          # Secure deployment flags + secrets binding
          flags: '--concurrency=100 --max-instances=10 --min-instances=0 --set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest'
