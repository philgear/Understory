name: "CodeQL"

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run every Thursday at 8:30 PM UTC
    - cron: '30 20 * * 4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: 'javascript-typescript'
          - language: 'python'

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Python & Dependencies
      if: matrix.language == 'python'
      uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
      with:
        python-version: '3.11'

    - name: Install Python Sidecar Dependencies
      if: matrix.language == 'python'
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r pocketgull_api/requirements.txt || true

    - name: Initialize CodeQL
      uses: github/codeql-action/init@6ba5c05dce207b48ae07f8791b4313069c63fc2b # v3.26.6
      with:
        languages: ${{ matrix.language }}
        config-file: .github/codeql/codeql-config.yml

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6ba5c05dce207b48ae07f8791b4313069c63fc2b # v3.26.6
      with:
        category: "/language:${{ matrix.language }}"
