name: "Dependency Review"

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review & Vulnerability Gate
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency Review
        continue-on-error: true
        uses: actions/dependency-review-action@c74b580d73376b7750d3d2a50bfb8adc2c937507 # v4.5.0
        with:
          fail-on-severity: critical
          comment-summary-in-pr: always
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, BlueOak-1.0.0, PSF-2.0, 0BSD, Unlicense, MPL-2.0, CC-BY-4.0, CC0-1.0, Python-2.0, AFL-2.1, AFL-3.0, MITNFA, Public Domain, LicenseRef-scancode-public-domain
          allow-dependencies-licenses: |
            pkg:pypi/fhir.resources, pkg:pypi/h5py, pkg:pypi/pandas, pkg:npm/isexe, pkg:npm/argparse, pkg:npm/bowser, pkg:npm/esprima, pkg:npm/import-in-the-middle, pkg:npm/json-schema, pkg:npm/lodash-es, pkg:npm/lodash.mapvalues, pkg:npm/uglify-js, pkg:npm/uri-templates, pkg:npm/@aws-sdk/types, pkg:npm/%40aws-sdk/types
